name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  test:
    name: Test & Lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test -- --passWithNoTests

      - name: Run type check
        run: npm run type-check

      - name: Run linter
        run: npm run lint

  build:
    name: Build ${{ matrix.os }}
    needs: test
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: windows-latest
            target: win
          - os: macos-latest
            target: mac

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build app
        run: npm run build
        env:
          CI: true

      - name: Upload artifacts
        uses: actions/upload-artifact@v3
        with:
          name: ${{ matrix.os }}-build
          path: dist/
          retention-days: 5

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - uses: actions/checkout@v4

      - name: Download Windows artifacts
        uses: actions/download-artifact@v3
        with:
          name: windows-latest-build
          path: ./windows-build

      - name: Download macOS artifacts
        uses: actions/download-artifact@v3
        with:
          name: macos-latest-build
          path: ./macos-build

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            windows-build/**/*.exe
            windows-build/**/*.nsis
            macos-build/**/*.dmg
            macos-build/**/*.zip
          draft: false
          prerelease: ${{ contains(github.ref, 'alpha') || contains(github.ref, 'beta') || contains(github.ref, 'rc') }}
          body: |
            # JPE Mod Translator ${{ github.ref_name }}

            ## Download

            - **Windows Installer** (.nsis)
            - **Windows Portable** (.exe)
            - **macOS Installer** (.dmg)
            - **macOS Archive** (.zip)

            See [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/main/CHANGELOG.md) for details.

            ## Installation

            1. Download the installer for your platform
            2. Run the installer
            3. Follow the setup wizard
            4. Launch the application

            ## Verification

            - [View build log](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})
            - Platform: ${{ runner.os }}
            - Node.js: 18.x
            - Electron: 26.2.0

        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  notify:
    name: Notify Release
    needs: release
    runs-on: ubuntu-latest
    if: always()

    steps:
      - name: Check Build Status
        run: |
          if [ "${{ needs.test.result }}" == "success" ] && [ "${{ needs.build.result }}" == "success" ]; then
            echo "✅ Build successful!"
            exit 0
          else
            echo "❌ Build failed!"
            exit 1
          fi

      - name: Release Summary
        run: |
          echo "## Release Information"
          echo "- **Version**: ${{ github.ref_name }}"
          echo "- **Commit**: ${{ github.sha }}"
          echo "- **Branch**: ${{ github.ref }}"
          echo "- **Build**: ${{ github.run_number }}"

# Notes:
#
# This workflow:
# 1. Triggers on git tags (v1.0.0, v1.1.0, etc.)
# 2. Runs tests and lint checks
# 3. Builds on Windows and macOS
# 4. Creates GitHub release with binaries
# 5. Detects pre-releases (alpha, beta, rc)
#
# To trigger:
#
#   git tag -a v1.0.0 -m "Release v1.0.0"
#   git push origin v1.0.0
#
# Pre-release tags (automatically marked):
# - v1.0.0-alpha.1
# - v1.0.0-beta.1
# - v1.0.0-rc.1
#
# The workflow will:
# - Run all tests
# - Build for both platforms
# - Upload binaries to release
# - Generate release notes
#
# View workflow runs at:
# https://github.com/owner/repo/actions
