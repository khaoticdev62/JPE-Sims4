<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0c10;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#13151c;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0f1116;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="cyanGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#63B3ED;stop-opacity:0" />
      <stop offset="50%" style="stop-color:#63B3ED;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#63B3ED;stop-opacity:0" />
    </linearGradient>
    
    <linearGradient id="violetGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#8B5CF6;stop-opacity:0" />
      <stop offset="50%" style="stop-color:#8B5CF6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8B5CF6;stop-opacity:0" />
    </linearGradient>
    
    <linearGradient id="emeraldGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#48BB78;stop-opacity:0" />
      <stop offset="50%" style="stop-color:#48BB78;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#48BB78;stop-opacity:0" />
    </linearGradient>
    
    <filter id="glow">
      <feGaussianBlur stdDeviation="6" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    
    <filter id="glowStrong">
      <feGaussianBlur stdDeviation="10" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="800" height="400" fill="url(#bgGrad)"/>
  
  <!-- Grid pattern -->
  <g opacity="0.08">
    <line x1="0" y1="0" x2="0" y2="400" stroke="#63B3ED" stroke-width="1"/>
    <line x1="100" y1="0" x2="100" y2="400" stroke="#63B3ED" stroke-width="1"/>
    <line x1="200" y1="0" x2="200" y2="400" stroke="#63B3ED" stroke-width="1"/>
    <line x1="300" y1="0" x2="300" y2="400" stroke="#63B3ED" stroke-width="1"/>
    <line x1="400" y1="0" x2="400" y2="400" stroke="#63B3ED" stroke-width="1"/>
    <line x1="500" y1="0" x2="500" y2="400" stroke="#63B3ED" stroke-width="1"/>
    <line x1="600" y1="0" x2="600" y2="400" stroke="#63B3ED" stroke-width="1"/>
    <line x1="700" y1="0" x2="700" y2="400" stroke="#63B3ED" stroke-width="1"/>
    <line x1="800" y1="0" x2="800" y2="400" stroke="#63B3ED" stroke-width="1"/>
    
    <line x1="0" y1="0" x2="800" y2="0" stroke="#63B3ED" stroke-width="1"/>
    <line x1="0" y1="50" x2="800" y2="50" stroke="#63B3ED" stroke-width="1"/>
    <line x1="0" y1="100" x2="800" y2="100" stroke="#63B3ED" stroke-width="1"/>
    <line x1="0" y1="150" x2="800" y2="150" stroke="#63B3ED" stroke-width="1"/>
    <line x1="0" y1="200" x2="800" y2="200" stroke="#63B3ED" stroke-width="1"/>
    <line x1="0" y1="250" x2="800" y2="250" stroke="#63B3ED" stroke-width="1"/>
    <line x1="0" y1="300" x2="800" y2="300" stroke="#63B3ED" stroke-width="1"/>
    <line x1="0" y1="350" x2="800" y2="350" stroke="#63B3ED" stroke-width="1"/>
    <line x1="0" y1="400" x2="800" y2="400" stroke="#63B3ED" stroke-width="1"/>
  </g>
  
  <!-- Dashboard widgets representation -->
  <g opacity="0.7">
    <!-- Stats cards row -->
    <rect x="40" y="60" width="160" height="80" rx="8" fill="#13151c" stroke="#63B3ED" stroke-width="2" filter="url(#glow)"/>
    <text x="120" y="95" font-family="monospace" font-size="28" fill="#63B3ED" text-anchor="middle" font-weight="bold">1,247</text>
    <text x="120" y="120" font-family="monospace" font-size="11" fill="#A0AEC0" text-anchor="middle" letter-spacing="2">FILES</text>
    
    <rect x="220" y="60" width="160" height="80" rx="8" fill="#13151c" stroke="#8B5CF6" stroke-width="2" filter="url(#glow)"/>
    <text x="300" y="95" font-family="monospace" font-size="28" fill="#8B5CF6" text-anchor="middle" font-weight="bold">62,350</text>
    <text x="300" y="120" font-family="monospace" font-size="11" fill="#A0AEC0" text-anchor="middle" letter-spacing="2">STRINGS</text>
    
    <rect x="400" y="60" width="160" height="80" rx="8" fill="#13151c" stroke="#48BB78" stroke-width="2" filter="url(#glow)"/>
    <text x="480" y="95" font-family="monospace" font-size="28" fill="#48BB78" text-anchor="middle" font-weight="bold">87%</text>
    <text x="480" y="120" font-family="monospace" font-size="11" fill="#A0AEC0" text-anchor="middle" letter-spacing="2">COVERAGE</text>
    
    <rect x="580" y="60" width="160" height="80" rx="8" fill="#13151c" stroke="#FC8181" stroke-width="2" filter="url(#glow)"/>
    <text x="660" y="95" font-family="monospace" font-size="28" fill="#FC8181" text-anchor="middle" font-weight="bold">3</text>
    <text x="660" y="120" font-family="monospace" font-size="11" fill="#A0AEC0" text-anchor="middle" letter-spacing="2">CONFLICTS</text>
    
    <!-- Activity chart area -->
    <rect x="40" y="170" width="350" height="180" rx="8" fill="#13151c" stroke="#63B3ED" stroke-width="1" opacity="0.8"/>
    <text x="215" y="200" font-family="monospace" font-size="12" fill="#A0AEC0" text-anchor="middle" letter-spacing="2">PERFORMANCE METRICS</text>
    
    <!-- Chart lines -->
    <path d="M 60 320 Q 100 280 140 290 T 220 260 T 300 270 T 370 240" stroke="#63B3ED" stroke-width="2" fill="none" filter="url(#glow)"/>
    <path d="M 60 300 Q 100 310 140 280 T 220 290 T 300 260 T 370 270" stroke="#8B5CF6" stroke-width="2" fill="none" filter="url(#glow)"/>
    
    <!-- Recent activity list -->
    <rect x="410" y="170" width="350" height="180" rx="8" fill="#13151c" stroke="#8B5CF6" stroke-width="1" opacity="0.8"/>
    <text x="585" y="200" font-family="monospace" font-size="12" fill="#A0AEC0" text-anchor="middle" letter-spacing="2">RECENT ACTIVITY</text>
    
    <!-- Activity items -->
    <rect x="430" y="220" width="310" height="24" rx="4" fill="#0f1116"/>
    <circle cx="445" cy="232" r="4" fill="#48BB78"/>
    <text x="460" y="236" font-family="monospace" font-size="10" fill="#E2E8F0">tutorial_mod.jpe translated</text>
    
    <rect x="430" y="252" width="310" height="24" rx="4" fill="#0f1116"/>
    <circle cx="445" cy="264" r="4" fill="#63B3ED"/>
    <text x="460" y="268" font-family="monospace" font-size="10" fill="#E2E8F0">evil_trait.xml compiled</text>
    
    <rect x="430" y="284" width="310" height="24" rx="4" fill="#0f1116"/>
    <circle cx="445" cy="296" r="4" fill="#F6AD55"/>
    <text x="460" y="300" font-family="monospace" font-size="10" fill="#E2E8F0">Conflict detected in buff_...</text>
    
    <rect x="430" y="316" width="310" height="24" rx="4" fill="#0f1116"/>
    <circle cx="445" cy="328" r="4" fill="#48BB78"/>
    <text x="460" y="332" font-family="monospace" font-size="10" fill="#E2E8F0">STBL hash computed</text>
  </g>
  
  <!-- Title -->
  <text x="400" y="45" font-family="system-ui, sans-serif" font-size="20" font-weight="bold" fill="#E2E8F0" text-anchor="middle" filter="url(#glowStrong)" letter-spacing="6">DASHBOARD</text>
  
  <!-- Decorative corner elements -->
  <g opacity="0.6">
    <rect x="15" y="15" width="30" height="3" fill="#63B3ED"/>
    <rect x="15" y="15" width="3" height="30" fill="#63B3ED"/>
    
    <rect x="755" y="15" width="30" height="3" fill="#8B5CF6"/>
    <rect x="782" y="15" width="3" height="30" fill="#8B5CF6"/>
    
    <rect x="15" y="382" width="30" height="3" fill="#8B5CF6"/>
    <rect x="15" y="355" width="3" height="30" fill="#8B5CF6"/>
    
    <rect x="755" y="382" width="30" height="3" fill="#63B3ED"/>
    <rect x="782" y="355" width="3" height="30" fill="#63B3ED"/>
  </g>
</svg>
