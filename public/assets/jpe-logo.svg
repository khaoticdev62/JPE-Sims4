<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="logoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#63B3ED;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#8B5CF6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#63B3ED;stop-opacity:1" />
    </linearGradient>
    
    <filter id="glow">
      <feGaussianBlur stdDeviation="8" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    
    <filter id="glowStrong">
      <feGaussianBlur stdDeviation="12" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background circle -->
  <circle cx="256" cy="256" r="240" fill="#0a0c10" stroke="url(#logoGrad)" stroke-width="4" filter="url(#glow)"/>
  
  <!-- Outer ring -->
  <circle cx="256" cy="256" r="220" fill="none" stroke="#63B3ED" stroke-width="2" opacity="0.3"/>
  <circle cx="256" cy="256" r="200" fill="none" stroke="#8B5CF6" stroke-width="2" opacity="0.3"/>
  
  <!-- JPE Letters -->
  <g filter="url(#glowStrong)">
    <!-- J -->
    <path d="M 140 180 L 140 320 Q 140 360 180 360 L 200 360 Q 220 360 220 340 L 220 320" 
          stroke="url(#logoGrad)" stroke-width="24" fill="none" stroke-linecap="round"/>
    
    <!-- P -->
    <path d="M 240 360 L 240 180 L 300 180 Q 340 180 340 220 Q 340 260 300 260 L 240 260" 
          stroke="url(#logoGrad)" stroke-width="24" fill="none" stroke-linecap="round"/>
    
    <!-- E -->
    <path d="M 400 180 L 360 180 L 360 360 L 400 360" 
          stroke="url(#logoGrad)" stroke-width="24" fill="none" stroke-linecap="round"/>
    <path d="M 360 270 L 390 270" 
          stroke="url(#logoGrad)" stroke-width="24" fill="none" stroke-linecap="round"/>
  </g>
  
  <!-- Decorative elements -->
  <g opacity="0.6">
    <!-- Top accent line -->
    <rect x="200" y="120" width="112" height="4" fill="#63B3ED" filter="url(#glow)"/>
    
    <!-- Bottom accent line -->
    <rect x="200" y="388" width="112" height="4" fill="#8B5CF6" filter="url(#glow)"/>
    
    <!-- Corner accents -->
    <rect x="100" y="100" width="20" height="3" fill="#63B3ED"/>
    <rect x="100" y="100" width="3" height="20" fill="#63B3ED"/>
    
    <rect x="392" y="100" width="20" height="3" fill="#8B5CF6"/>
    <rect x="409" y="100" width="3" height="20" fill="#8B5CF6"/>
    
    <rect x="100" y="389" width="20" height="3" fill="#8B5CF6"/>
    <rect x="100" y="372" width="3" height="20" fill="#8B5CF6"/>
    
    <rect x="392" y="389" width="20" height="3" fill="#63B3ED"/>
    <rect x="409" y="372" width="3" height="20" fill="#63B3ED"/>
  </g>
  
  <!-- Code brackets -->
  <g opacity="0.4" filter="url(#glow)">
    <path d="M 160 140 L 130 170 L 160 200" stroke="#63B3ED" stroke-width="3" fill="none"/>
    <path d="M 352 140 L 382 170 L 352 200" stroke="#8B5CF6" stroke-width="3" fill="none"/>
  </g>
</svg>
