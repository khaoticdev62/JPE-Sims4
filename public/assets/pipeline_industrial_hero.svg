<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400">
  <!-- Dark metallic background -->
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0c10;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#13151c;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0f1116;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="neonBlue" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#63B3ED;stop-opacity:0" />
      <stop offset="50%" style="stop-color:#63B3ED;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#63B3ED;stop-opacity:0" />
    </linearGradient>
    
    <linearGradient id="neonViolet" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#8B5CF6;stop-opacity:0" />
      <stop offset="50%" style="stop-color:#8B5CF6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8B5CF6;stop-opacity:0" />
    </linearGradient>
    
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    
    <filter id="glowStrong">
      <feGaussianBlur stdDeviation="8" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="800" height="400" fill="url(#bgGrad)"/>
  
  <!-- Grid pattern -->
  <g opacity="0.1">
    <line x1="0" y1="0" x2="0" y2="400" stroke="#63B3ED" stroke-width="1"/>
    <line x1="100" y1="0" x2="100" y2="400" stroke="#63B3ED" stroke-width="1"/>
    <line x1="200" y1="0" x2="200" y2="400" stroke="#63B3ED" stroke-width="1"/>
    <line x1="300" y1="0" x2="300" y2="400" stroke="#63B3ED" stroke-width="1"/>
    <line x1="400" y1="0" x2="400" y2="400" stroke="#63B3ED" stroke-width="1"/>
    <line x1="500" y1="0" x2="500" y2="400" stroke="#63B3ED" stroke-width="1"/>
    <line x1="600" y1="0" x2="600" y2="400" stroke="#63B3ED" stroke-width="1"/>
    <line x1="700" y1="0" x2="700" y2="400" stroke="#63B3ED" stroke-width="1"/>
    <line x1="800" y1="0" x2="800" y2="400" stroke="#63B3ED" stroke-width="1"/>
    
    <line x1="0" y1="0" x2="800" y2="0" stroke="#63B3ED" stroke-width="1"/>
    <line x1="0" y1="50" x2="800" y2="50" stroke="#63B3ED" stroke-width="1"/>
    <line x1="0" y1="100" x2="800" y2="100" stroke="#63B3ED" stroke-width="1"/>
    <line x1="0" y1="150" x2="800" y2="150" stroke="#63B3ED" stroke-width="1"/>
    <line x1="0" y1="200" x2="800" y2="200" stroke="#63B3ED" stroke-width="1"/>
    <line x1="0" y1="250" x2="800" y2="250" stroke="#63B3ED" stroke-width="1"/>
    <line x1="0" y1="300" x2="800" y2="300" stroke="#63B3ED" stroke-width="1"/>
    <line x1="0" y1="350" x2="800" y2="350" stroke="#63B3ED" stroke-width="1"/>
    <line x1="0" y1="400" x2="800" y2="400" stroke="#63B3ED" stroke-width="1"/>
  </g>
  
  <!-- Circuit lines - Blue -->
  <g filter="url(#glow)">
    <path d="M 100 200 L 250 200 L 300 150 L 500 150" stroke="url(#neonBlue)" stroke-width="3" fill="none" opacity="0.8"/>
    <path d="M 150 250 L 350 250 L 400 200 L 600 200" stroke="url(#neonBlue)" stroke-width="2" fill="none" opacity="0.6"/>
    <path d="M 50 300 L 200 300 L 250 250 L 450 250" stroke="url(#neonBlue)" stroke-width="2.5" fill="none" opacity="0.7"/>
  </g>
  
  <!-- Circuit lines - Violet -->
  <g filter="url(#glow)">
    <path d="M 300 100 L 450 100 L 500 150 L 700 150" stroke="url(#neonViolet)" stroke-width="3" fill="none" opacity="0.8"/>
    <path d="M 350 300 L 500 300 L 550 250 L 750 250" stroke="url(#neonViolet)" stroke-width="2" fill="none" opacity="0.6"/>
    <path d="M 200 350 L 400 350 L 450 300 L 650 300" stroke="url(#neonViolet)" stroke-width="2.5" fill="none" opacity="0.7"/>
  </g>
  
  <!-- Nodes/Circles -->
  <g filter="url(#glowStrong)">
    <circle cx="250" cy="200" r="8" fill="#63B3ED" opacity="0.9"/>
    <circle cx="500" cy="150" r="10" fill="#63B3ED" opacity="1"/>
    <circle cx="350" cy="250" r="6" fill="#63B3ED" opacity="0.8"/>
    <circle cx="600" cy="200" r="7" fill="#63B3ED" opacity="0.9"/>
    
    <circle cx="450" cy="100" r="8" fill="#8B5CF6" opacity="0.9"/>
    <circle cx="700" cy="150" r="10" fill="#8B5CF6" opacity="1"/>
    <circle cx="500" cy="300" r="6" fill="#8B5CF6" opacity="0.8"/>
    <circle cx="750" cy="250" r="7" fill="#8B5CF6" opacity="0.9"/>
  </g>
  
  <!-- Build pipeline text -->
  <text x="400" y="180" font-family="monospace" font-size="48" font-weight="bold" fill="#E2E8F0" text-anchor="middle" filter="url(#glowStrong)" letter-spacing="4">BUILD</text>
  <text x="400" y="230" font-family="monospace" font-size="36" font-weight="bold" fill="#63B3ED" text-anchor="middle" filter="url(#glow)" letter-spacing="6">PIPELINE</text>
  <text x="400" y="270" font-family="monospace" font-size="16" fill="#A0AEC0" text-anchor="middle" letter-spacing="2">INDUSTRAL ENGINE v4.2.0</text>
  
  <!-- Decorative corner elements -->
  <g opacity="0.6">
    <rect x="20" y="20" width="40" height="3" fill="#63B3ED"/>
    <rect x="20" y="20" width="3" height="40" fill="#63B3ED"/>
    
    <rect x="740" y="20" width="40" height="3" fill="#8B5CF6"/>
    <rect x="777" y="20" width="3" height="40" fill="#8B5CF6"/>
    
    <rect x="20" y="377" width="40" height="3" fill="#8B5CF6"/>
    <rect x="20" y="340" width="3" height="40" fill="#8B5CF6"/>
    
    <rect x="740" y="377" width="40" height="3" fill="#63B3ED"/>
    <rect x="777" y="340" width="3" height="40" fill="#63B3ED"/>
  </g>
</svg>
