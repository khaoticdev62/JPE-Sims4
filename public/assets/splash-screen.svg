<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0c10;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#13151c;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0f1116;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="neonBlue" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#63B3ED;stop-opacity:0" />
      <stop offset="50%" style="stop-color:#63B3ED;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#63B3ED;stop-opacity:0" />
    </linearGradient>
    
    <linearGradient id="neonViolet" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#8B5CF6;stop-opacity:0" />
      <stop offset="50%" style="stop-color:#8B5CF6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8B5CF6;stop-opacity:0" />
    </linearGradient>
    
    <radialGradient id="centerGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#63B3ED;stop-opacity:0.3" />
      <stop offset="100%" style="stop-color:#0a0c10;stop-opacity:0" />
    </radialGradient>
    
    <filter id="glow">
      <feGaussianBlur stdDeviation="6" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    
    <filter id="glowStrong">
      <feGaussianBlur stdDeviation="10" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="800" height="600" fill="url(#bgGrad)"/>
  
  <!-- Center glow -->
  <circle cx="400" cy="300" r="250" fill="url(#centerGlow)"/>
  
  <!-- Grid pattern -->
  <g opacity="0.08">
    <line x1="0" y1="0" x2="0" y2="600" stroke="#63B3ED" stroke-width="1"/>
    <line x1="100" y1="0" x2="100" y2="600" stroke="#63B3ED" stroke-width="1"/>
    <line x1="200" y1="0" x2="200" y2="600" stroke="#63B3ED" stroke-width="1"/>
    <line x1="300" y1="0" x2="300" y2="600" stroke="#63B3ED" stroke-width="1"/>
    <line x1="400" y1="0" x2="400" y2="600" stroke="#63B3ED" stroke-width="1"/>
    <line x1="500" y1="0" x2="500" y2="600" stroke="#63B3ED" stroke-width="1"/>
    <line x1="600" y1="0" x2="600" y2="600" stroke="#63B3ED" stroke-width="1"/>
    <line x1="700" y1="0" x2="700" y2="600" stroke="#63B3ED" stroke-width="1"/>
    <line x1="800" y1="0" x2="800" y2="600" stroke="#63B3ED" stroke-width="1"/>
    
    <line x1="0" y1="0" x2="800" y2="0" stroke="#63B3ED" stroke-width="1"/>
    <line x1="0" y1="100" x2="800" y2="100" stroke="#63B3ED" stroke-width="1"/>
    <line x1="0" y1="200" x2="800" y2="200" stroke="#63B3ED" stroke-width="1"/>
    <line x1="0" y1="300" x2="800" y2="300" stroke="#63B3ED" stroke-width="1"/>
    <line x1="0" y1="400" x2="800" y2="400" stroke="#63B3ED" stroke-width="1"/>
    <line x1="0" y1="500" x2="800" y2="500" stroke="#63B3ED" stroke-width="1"/>
    <line x1="0" y1="600" x2="800" y2="600" stroke="#63B3ED" stroke-width="1"/>
  </g>
  
  <!-- Central JPE Logo -->
  <g filter="url(#glowStrong)" transform="translate(0, -30)">
    <!-- J -->
    <path d="M 300 250 L 300 370 Q 300 400 330 400 L 350 400 Q 370 400 370 380 L 370 360" 
          stroke="#63B3ED" stroke-width="16" fill="none" stroke-linecap="round"/>
    
    <!-- P -->
    <path d="M 390 400 L 390 250 L 440 250 Q 470 250 470 280 Q 470 310 440 310 L 390 310" 
          stroke="#8B5CF6" stroke-width="16" fill="none" stroke-linecap="round"/>
    
    <!-- E -->
    <path d="M 520 250 L 490 250 L 490 400 L 520 400" 
          stroke="#63B3ED" stroke-width="16" fill="none" stroke-linecap="round"/>
    <path d="M 490 325 L 510 325" 
          stroke="#63B3ED" stroke-width="16" fill="none" stroke-linecap="round"/>
  </g>
  
  <!-- Title Text -->
  <text x="400" y="160" font-family="system-ui, sans-serif" font-size="42" font-weight="bold" fill="#E2E8F0" text-anchor="middle" filter="url(#glowStrong)" letter-spacing="8">JPE STUDIO</text>
  <text x="400" y="195" font-family="monospace" font-size="16" fill="#A0AEC0" text-anchor="middle" letter-spacing="4">JUST PLAIN ENGLISH</text>
  
  <!-- Loading bar -->
  <g transform="translate(0, 80)">
    <rect x="250" y="450" width="300" height="4" fill="#13151c" stroke="#63B3ED" stroke-width="1" opacity="0.5"/>
    <rect x="250" y="450" width="180" height="4" fill="url(#neonBlue)" filter="url(#glow)">
      <animate attributeName="width" values="0;300;0" dur="3s" repeatCount="indefinite"/>
    </rect>
  </g>
  
  <!-- Loading text -->
  <text x="400" y="490" font-family="monospace" font-size="14" fill="#63B3ED" text-anchor="middle" letter-spacing="3" opacity="0.8">
    INITIALIZING
    <animate attributeName="opacity" values="0.4;1;0.4" dur="1.5s" repeatCount="indefinite"/>
  </text>
  
  <!-- Decorative corner elements -->
  <g opacity="0.6">
    <rect x="30" y="30" width="50" height="3" fill="#63B3ED"/>
    <rect x="30" y="30" width="3" height="50" fill="#63B3ED"/>
    
    <rect x="720" y="30" width="50" height="3" fill="#8B5CF6"/>
    <rect x="767" y="30" width="3" height="50" fill="#8B5CF6"/>
    
    <rect x="30" y="567" width="50" height="3" fill="#8B5CF6"/>
    <rect x="30" y="520" width="3" height="50" fill="#8B5CF6"/>
    
    <rect x="720" y="567" width="50" height="3" fill="#63B3ED"/>
    <rect x="767" y="520" width="3" height="50" fill="#63B3ED"/>
  </g>
  
  <!-- Version number -->
  <text x="400" y="550" font-family="monospace" font-size="11" fill="#4A5568" text-anchor="middle" letter-spacing="2">v2.1.0 — INDUSTRIAL UPDATE</text>
</svg>
